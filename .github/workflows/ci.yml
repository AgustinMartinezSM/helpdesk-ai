name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ephemeral CI database URL; also consumed by prisma generate/config.
  # These credentials exist only inside the throwaway service container.
  DATABASE_URL: postgresql://auth_service:helpdesk_local_only_auth@localhost:5433/helpdesk_auth_test

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: helpdesk_admin
          POSTGRES_PASSWORD: helpdesk_ci_only_pg
          POSTGRES_DB: helpdesk_platform
        ports:
          - '5433:5432'
        options: >-
          --health-cmd "pg_isready -U helpdesk_admin -d helpdesk_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4.3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: helpdesk
          RABBITMQ_DEFAULT_PASS: helpdesk_local_only_rabbit
        ports:
          - '5672:5672'
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from the packageManager field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      # Service containers cannot mount infrastructure/postgres/init, so the
      # service roles and test databases are provisioned explicitly.
      - name: Provision service test databases
        run: |
          psql "postgresql://helpdesk_admin:helpdesk_ci_only_pg@localhost:5433/helpdesk_platform" \
            -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE auth_service LOGIN PASSWORD 'helpdesk_local_only_auth' CREATEDB;" \
            -c "CREATE DATABASE helpdesk_auth_test OWNER auth_service;" \
            -c "CREATE ROLE tickets_service LOGIN PASSWORD 'helpdesk_local_only_tickets' CREATEDB;" \
            -c "CREATE DATABASE helpdesk_tickets_test OWNER tickets_service;" \
            -c "CREATE ROLE users_service LOGIN PASSWORD 'helpdesk_local_only_users' CREATEDB;" \
            -c "CREATE DATABASE helpdesk_users_test OWNER users_service;" \
            -c "CREATE ROLE audit_service LOGIN PASSWORD 'helpdesk_local_only_audit' CREATEDB;" \
            -c "CREATE DATABASE helpdesk_audit_test OWNER audit_service;" \
            -c "CREATE ROLE notification_service LOGIN PASSWORD 'helpdesk_local_only_notifications' CREATEDB;" \
            -c "CREATE DATABASE helpdesk_notifications_test OWNER notification_service;" \
            -c "CREATE ROLE analytics_service LOGIN PASSWORD 'helpdesk_local_only_analytics' CREATEDB;" \
            -c "CREATE DATABASE helpdesk_analytics_test OWNER analytics_service;"

      - name: Integration tests (real PostgreSQL and RabbitMQ)
        run: |
          pnpm nx run @helpdesk-ai/messaging:test-integration
          pnpm nx run @helpdesk-ai/auth-service:test-integration
          pnpm nx run @helpdesk-ai/tickets-service:test-integration
          pnpm nx run @helpdesk-ai/users-service:test-integration
          pnpm nx run @helpdesk-ai/audit-service:test-integration
          pnpm nx run @helpdesk-ai/notification-service:test-integration
          pnpm nx run @helpdesk-ai/analytics-service:test-integration
