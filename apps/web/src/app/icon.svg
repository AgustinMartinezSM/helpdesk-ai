<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The application icon. Same geometry as components/brand/mark.tsx, with
    the token values written out because a favicon is loaded outside the
    document and inherits no custom properties.

    #ffee8c is --brand and #1a1a17 is --brand-on: 14.83:1, and identical in
    both themes, so this one file serves a light and a dark browser chrome.
  -->
  <rect width="32" height="32" rx="8" fill="#ffee8c"/>
  <g fill="#1a1a17">
    <circle cx="8" cy="16" r="3.25"/>
    <rect x="13.5" y="14.25" width="8.5" height="3.5" rx="1.75"/>
    <rect x="24" y="10" width="3.5" height="12" rx="1.75"/>
  </g>
</svg>
