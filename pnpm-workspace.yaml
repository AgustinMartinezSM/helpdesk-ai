packages:
  - 'apps/*'
  - 'libs/*'

# pnpm 11 blocks dependency build scripts by default (supply-chain hardening).
# Only toolchain packages that genuinely need native postinstall steps are allowed.
# 'less' is a transitive dependency of @nx/next; we do not use Less, so its
# build script stays blocked.
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  # Install-analytics telemetry (transitive via prisma); deliberately blocked.
  '@scarf/scarf': false
  '@swc/core': true
  argon2: true
  less: false
  nx: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@prisma/client-runtime-utils@7.9.1'
  - '@prisma/client@7.9.1'
  - '@prisma/config@7.9.1'
  - '@prisma/debug@7.9.1'
  - '@prisma/dev@0.24.17'
  - '@prisma/engines@7.9.1'
  - '@prisma/fetch-engine@7.9.1'
  - '@prisma/get-platform@7.9.1'
  - prisma@7.9.1
  - '@prisma/adapter-pg@7.9.1'
  - '@prisma/driver-adapter-utils@7.9.1'
